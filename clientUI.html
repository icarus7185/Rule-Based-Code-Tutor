<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Code Tutor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 1500px; margin: 0 auto; }
        .control-group { margin-bottom: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        label { font-weight: bold; display: block; margin-top: 10px; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 20px; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; }
        
        .image-container { display: flex; gap: 15px; justify-content: space-between; margin-top: 10px; }
        .image-box { flex: 1; text-align: center; border: 1px solid #ddd; padding: 10px; border-radius: 8px; background: #f9f9f9; }
        .image-box img { width: 100%; height: auto; display: block; margin-top: 10px; border-radius: 4px; }
        .image-box h3 { margin: 0; color: #333; font-size: 14px; }
        
        .loading { color: #666; font-style: italic; display: none; }
        
        .input-method-group { margin-bottom: 20px; }
        .input-method-group label { display: inline-block; margin-right: 20px; margin-top: 0; font-weight: normal; }
        .input-method-group input[type="radio"] { margin-right: 5px; cursor: pointer; }
        
        #textareaContainer { display: block; }
        #fileUploadContainer { display: none; }
    </style>
</head>
    
<body>
    <h1>Rule-Based Code Tutor</h1>
    
    <div class="input-method-group">
        <label>
            <input type="radio" name="inputMethod" value="textarea" checked onchange="switchInputMethod()">
            Nhập trực tiếp
        </label>
        <label>
            <input type="radio" name="inputMethod" value="file" onchange="switchInputMethod()">
            Upload file .cpp
        </label>
    </div>

    <div id="textareaContainer">
        <label>Nhập đoạn code C++:</label>
        <textarea id="sourceCode"></textarea>
    </div>
    
    <div id="fileUploadContainer">
        <label>Chọn file .cpp:</label>
        <div class="control-group" style="margin-bottom: 20px;">
            <input type="file" id="cppFileInput" accept=".cpp" style="flex: 1; padding: 10px;">
        </div>
    </div>
    
    <div class="control-group">
        <button id="btnGen" onclick="runWorkflow()">Analyzer</button>
    </div>
    
    <iframe id="resultFrame" width="100%" height="100%" title="Embedded HTML Content"></iframe>

    <script>
        // Chuyển đổi giữa nhập trực tiếp và upload file
        function switchInputMethod() {
            const method = document.querySelector('input[name="inputMethod"]:checked').value;
            const textareaContainer = document.getElementById('textareaContainer');
            const fileUploadContainer = document.getElementById('fileUploadContainer');
            
            if (method === 'textarea') {
                textareaContainer.style.display = 'block';
                fileUploadContainer.style.display = 'none';
            } else {
                textareaContainer.style.display = 'none';
                fileUploadContainer.style.display = 'block';
            }
        }
        
        

        async function runWorkflow() {
            const method = document.querySelector('input[name="inputMethod"]:checked').value;
            const refinedArea = document.getElementById('sourceCode');
            const btn = document.getElementById('btnGen');
            
            // 1. Reset trạng thái
            btn.disabled = true;

            try {
                let htmlResponse;
                
                // 2. Gọi API dựa vào phương thức nhập
                if (method === 'textarea') {
                    // Gọi API với dữ liệu từ textarea
                    htmlResponse = await fetch(`/api/analyze?input_source_code=${encodeURIComponent(refinedArea.value)}`);
                } else {
                    // Gọi API upload file .cpp - trả về HTML trực tiếp
                    const fileInput = document.getElementById('cppFileInput');
                    const file = fileInput.files[0];
                    
                    if (!file) {
                        alert('Vui lòng chọn file .cpp');
                        btn.disabled = false;
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    htmlResponse = await fetch('/api/upload-cpp', {
                        method: 'POST',
                        body: formData
                    });
                }
                
                // 3. Mở kết quả HTML trong tab mới
                const htmlText = await htmlResponse.text();
                
                // Sửa các ký tự escape \n thành newline thực
                const cleanedHtml = htmlText.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\\"/g, '"');
                
                const blob = new Blob([cleanedHtml], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');

                var iframe = document.getElementById('resultFrame');
                var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Write the HTML string into the iframe's document
                iframeDoc.open();
                iframeDoc.write(cleanedHtml);
                iframeDoc.close();

            } catch (error) {
                alert("Có lỗi: " + error.message);
            } finally {
                btn.disabled = false;
            }
        }
 
    </script>

</html>
